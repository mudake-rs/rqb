services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rqb
      POSTGRES_PASSWORD: rqb
      POSTGRES_DB: rqb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rqb -d rqb"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ../tests/sql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
