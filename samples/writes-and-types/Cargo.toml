[package]
name = "rqb-sample-writes-and-types"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
chrono = "0.4.45"
rqb = { path = "../../crates/rqb" }
rqb-sample-schema = { path = "../schema" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "bigdecimal", "chrono", "uuid", "json"] }
uuid = "1.23.4"
