services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: rqb
      POSTGRES_PASSWORD: rqb
      POSTGRES_DB: rqb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rqb -d rqb"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ../tests/sql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
