[package]
name = "rqb-sample-raw-query"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rqb = { path = "../../crates/rqb", features = ["pool", "with-uuid", "with-chrono"] }
rqb-sample-base = { path = "../sample-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
