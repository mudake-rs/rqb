services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: rqb
      POSTGRES_PASSWORD: rqb
      POSTGRES_DB: rqb
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rqb -d rqb"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ../tests/sql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  tests:
    build:
      context: ..
      dockerfile: test/Dockerfile
    working_dir: /app
    volumes:
      - ../:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/app/target
    environment:
      RQB_TEST_DATABASE_URL: postgres://rqb:rqb@postgres:5432/rqb
      RUST_BACKTRACE: 1
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc '
        . /usr/local/cargo/env;
        until (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; do sleep 0.5; done;
        cargo test --workspace --all-features &&
        cargo test -p rqb --test postgres_integration --all-features -- --ignored --test-threads=1 &&
        cargo check --workspace --no-default-features
      '

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
