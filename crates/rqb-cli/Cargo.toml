[package]
name = "rqb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Schema introspection and code generation for rqb."
readme = "README.md"
keywords = ["postgres", "query-builder", "codegen", "database", "cli"]
categories = ["database", "command-line-utilities", "development-tools"]

[[bin]]
name = "rqb"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
heck.workspace = true
sqlx.workspace = true
syn = { workspace = true, features = ["full", "parsing"] }
tokio.workspace = true
