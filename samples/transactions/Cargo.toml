[package]
name = "rqb-sample-transactions"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rqb = { path = "../../crates/rqb" }
rqb-sample-schema = { path = "../schema" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "uuid", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
uuid = "1.23.4"
